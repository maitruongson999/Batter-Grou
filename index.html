<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Batter Grou</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.wrap{width:min(94vw,560px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:30px;margin:0;letter-spacing:1px}.score{font-size:18px;font-weight:bold}
.gamebox{background:#111b2d;border:1px solid #26354e;border-radius:18px;padding:12px;box-shadow:0 12px 35px #0006}
canvas{display:block;width:100%;aspect-ratio:1/1;background:#07101c;border-radius:12px;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:14px}
button{width:64px;height:52px;border:0;border-radius:12px;background:#253550;color:#fff;font-size:24px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.96);background:#3b5275}
#up{grid-column:2}#left{grid-column:1}#down{grid-column:2}#right{grid-column:3}
.actions{margin-top:12px}.restart{width:140px;font-size:15px;background:#334b70}
.info{font-size:13px;color:#aab7ca;margin:12px 0 0}.status{min-height:20px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🐍 Batter Grou</h1><div class="score">Score: <span id="score">0</span></div></div>
  <div class="gamebox">
    <canvas id="game" width="420" height="420" aria-label="Batter Grou snake game"></canvas>
    <div class="status" id="status">Use Arrow Keys or WASD to move</div>
    <div class="controls" aria-label="Touch controls">
      <button id="up" type="button" aria-label="Move up">▲</button>
      <button id="left" type="button" aria-label="Move left">◀</button>
      <button id="down" type="button" aria-label="Move down">▼</button>
      <button id="right" type="button" aria-label="Move right">▶</button>
    </div>
    <div class="actions"><button class="restart" id="restart" type="button">Restart Game</button></div>
    <p class="info">Eat the glowing food, grow longer, and avoid the walls and your own tail.</p>
  </div>
</div>
<script>
(() => {
  const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
  const scoreEl=document.getElementById("score"),statusEl=document.getElementById("status");
  const N=21, cell=canvas.width/N, tickMs=115;
  let snake,dir,nextDir,food,score,running,timer;

  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; running=true;
    scoreEl.textContent=score; statusEl.textContent="Use Arrow Keys or WASD to move";
    placeFood(); draw(); clearInterval(timer); timer=setInterval(tick,tickMs);
  }
  function placeFood(){
    do { food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function setDir(x,y){
    if(!running) return;
    if(x===-dir.x && y===-dir.y) return;
    nextDir={x,y};
  }
  function tick(){
    if(!running)return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
      running=false; clearInterval(timer); statusEl.textContent="Game Over — press Restart"; draw(); return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;placeFood();}
    else snake.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle="#07101c";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#0e1a2b";ctx.lineWidth=1;
    for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke();}
    ctx.fillStyle="#ffcc55";ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.29,0,Math.PI*2);ctx.fill();
    snake.forEach((s,i)=>{ctx.fillStyle=i===0?"#66e0a3":"#39b978";ctx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4);});
  }
  document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase(); const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
    if(m){e.preventDefault();setDir(m[0],m[1]);}
  });
  [["up",0,-1],["down",0,1],["left",-1,0],["right",1,0]].forEach(([id,x,y])=>document.getElementById(id).addEventListener("click",()=>setDir(x,y)));
  document.getElementById("restart").addEventListener("click",reset);
  reset();
})();
</script>
</body>
</html>
